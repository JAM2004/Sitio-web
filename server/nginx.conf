# CIE Conecta — nginx (Fase E3b)
# Debian/Ubuntu: copiar a /etc/nginx/sites-available/cie-conecta y symlink a
# /etc/nginx/sites-enabled/. En RHEL va en /etc/nginx/conf.d/ sin symlink.
# El cliente (Vite) se sirve desde client/dist; la API Node vive en 127.0.0.1:3001

server {
    listen 80;
    listen [::]:80;
    server_name www.tudominio.com tudominio.com;

    # Certbot renueva el certificado por este camino
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.tudominio.com tudominio.com;

    ssl_certificate     /etc/letsencrypt/live/tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tudominio.com/privkey.pem;

    root /var/www/cie-conecta/client/dist;
    index index.html;

    # multer acepta hasta 10MB; sin esto nginx corta los uploads en 1MB (413)
    client_max_body_size 12m;

    # Los assets de Vite llevan hash en el nombre → caché largo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # El cliente pide /api/login y Express escucha /login: la barra final del
    # proxy_pass quita el prefijo /api (mismo truco que el rewrite de Vite)
    location /api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Imágenes del editor: Express las sirve en /uploads (igual que en dev)
    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }

    # SPA: cualquier ruta inexistente cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}