# CIE Conecta — nginx del contenedor `web` (Fase G)
# Sirve el build del cliente (client/dist → /usr/share/nginx/html) y hace de
# proxy de la API Node. El TLS lo termina Cloudflare frente a este contenedor
# (la app escucha HTTP en el puerto 80): ver DEPLOY.md para DNS y certificados.
# Reemplaza a la variante host+certbot de la fase E3b: nginx corre dentro de
# Docker, no en el sistema, así que ya no hay rutas /etc/nginx ni Let's Encrypt
# dentro del contenedor.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # multer acepta hasta 10MB; sin esto nginx corta los uploads en 1MB (413)
    client_max_body_size 12m;

    # Los assets de Vite llevan hash en el nombre → caché largo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # El cliente pide /api/login y Express escucha /login: la barra final del
    # proxy_pass quita el prefijo /api (mismo truco que el rewrite de Vite).
    # `app` es el nombre del servicio en docker-compose.yml (red interna).
    location /api/ {
        proxy_pass http://app:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Imágenes del editor: Express las sirve en /uploads (igual que en dev)
    location /uploads/ {
        proxy_pass http://app:3001;
        proxy_set_header Host $host;
    }

    # SPA: cualquier ruta inexistente cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
